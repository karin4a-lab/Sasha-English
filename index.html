<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Саша • English</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div><div class="eyebrow">Саша • English</div><h1>Учим слова</h1></div><div class="streak" id="streak">0 ⭐</div></header>
  <main class="wrap">
    <section id="homeView"><div class="hero"><div><h2>Выбери тему</h2><p>5–10 минут в день: карточки, произношение и мини‑тест.</p></div><div class="hero-badge">A1</div></div><div id="topicGrid" class="topic-grid"></div></section>
    <section id="studyView" class="hidden">
      <button class="back" id="backBtn">← Темы</button>
      <div class="study-head"><div><div class="eyebrow" id="topicType"></div><h2 id="topicTitle"></h2></div><div class="progress-pill" id="progressPill"></div></div>
      <div class="mode-tabs"><button class="mode active" data-mode="cards">Карточки</button><button class="mode" data-mode="quiz">Тест</button><button class="mode" data-mode="typing">Написание</button></div>
      <div id="cardsMode"><div class="flashcard"><div class="card-visual" id="cardVisual"></div><div class="word" id="word"></div><div class="translation" id="translation"></div><button class="sound" id="soundBtn">🔊 Послушать</button></div><div class="card-actions"><button class="secondary" id="againBtn">Повторить</button><button class="primary" id="knowBtn">Знаю ✓</button></div><div class="counter" id="counter"></div></div>
      <div id="quizMode" class="hidden"><div class="quiz-card"><div class="quiz-label">Как переводится?</div><div class="quiz-word" id="quizWord"></div><button class="sound compact" id="quizSoundBtn">🔊</button><div id="quizOptions" class="options"></div><div id="quizFeedback" class="feedback"></div><button class="primary full hidden" id="nextQuizBtn">Дальше</button></div></div>
      <div id="typingMode" class="hidden"><div class="quiz-card"><div class="quiz-label">Напиши по‑английски</div><div class="quiz-word ru" id="typingPrompt"></div><input id="typingInput" class="typing-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="English word"><button class="primary full" id="checkTypingBtn">Проверить</button><div id="typingFeedback" class="feedback"></div><button class="secondary full hidden" id="nextTypingBtn">Следующее слово</button></div></div>
    </section>
  </main>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
